<svg viewBox="0 0 720 600" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="拾光 Lumen 系统架构图">
  <title>拾光 Lumen 系统架构</title>
  <desc>React 前端 → FastAPI → 拾光大脑（记忆/会议/工具）→ 外部服务（DeepSeek/Ollama/GLM-4.6V/双源搜索）</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E9384"/>
    </marker>
  </defs>
  <style>
    .layer { fill: #F2FAF8; stroke: #3EC9B0; stroke-width: 1; rx: 12; }
    .box { fill: #FFFFFF; stroke: #0E9384; stroke-width: 1.5; rx: 8; }
    .box-dim { fill: #FFFFFF; stroke: #8FCFC4; stroke-width: 1.2; rx: 8; }
    .ext { fill: #FFFDF5; stroke: #D9A441; stroke-width: 1.2; rx: 8; }
    .lbl { font: 600 14px -apple-system, 'Segoe UI', sans-serif; fill: #0E9384; }
    .t { font: 500 13px -apple-system, 'Segoe UI', sans-serif; fill: #1a1a1e; }
    .ts { font: 400 11px -apple-system, 'Segoe UI', sans-serif; fill: #5a5a60; }
    .arrow { stroke: #0E9384; stroke-width: 1.6; marker-end: url(#arrow); fill: none; }
  </style>

  <!-- 第 1 层：前端 -->
  <rect x="30" y="20" width="660" height="76" class="layer"/>
  <text x="50" y="44" class="lbl">用户界面</text>
  <rect x="230" y="34" width="300" height="52" class="box"/>
  <text x="380" y="56" text-anchor="middle" class="t">React + TS 前端</text>
  <text x="380" y="74" text-anchor="middle" class="ts">三栏：学习路径 · 聊天 · 星阁（先贤会议）</text>

  <!-- 第 1→2 层箭头 -->
  <line x1="380" y1="96" x2="380" y2="130" class="arrow"/>
  <text x="395" y="117" class="ts">SSE 流式 /api</text>

  <!-- 第 2 层：API -->
  <rect x="30" y="140" width="660" height="70" class="layer"/>
  <text x="50" y="164" class="lbl">服务层</text>
  <rect x="230" y="152" width="300" height="46" class="box"/>
  <text x="380" y="172" text-anchor="middle" class="t">FastAPI 入口</text>
  <text x="380" y="189" text-anchor="middle" class="ts">鉴权 · SSE 对话流 · 上传 · 会议 · 蒸馏 API · 看门狗双服务</text>

  <!-- 第 2→3 层箭头 -->
  <line x1="380" y1="210" x2="380" y2="244" class="arrow"/>

  <!-- 第 3 层：Agent 核心 -->
  <rect x="30" y="254" width="660" height="216" class="layer"/>
  <text x="50" y="278" class="lbl">Agent 核心层</text>

  <!-- 大脑 -->
  <rect x="50" y="292" width="280" height="60" class="box"/>
  <text x="190" y="314" text-anchor="middle" class="t">拾光大脑（Pydantic AI Agent）</text>
  <text x="190" y="332" text-anchor="middle" class="ts">画像/状态轮/行为前缀注入 · 主备模型 fallback</text>

  <!-- 三个子系统 -->
  <rect x="50" y="368" width="195" height="86" class="box-dim"/>
  <text x="147" y="390" text-anchor="middle" class="t">🧠 记忆系统</text>
  <text x="147" y="408" text-anchor="middle" class="ts">状态轮 · 9 字段</text>
  <text x="147" y="423" text-anchor="middle" class="ts">三因子排序</text>
  <text x="147" y="438" text-anchor="middle" class="ts">JIT 向量检索</text>

  <rect x="262" y="368" width="195" height="86" class="box-dim"/>
  <text x="359" y="390" text-anchor="middle" class="t">🗣️ 先贤会议</text>
  <text x="359" y="408" text-anchor="middle" class="ts">星宿多角色研讨</text>
  <text x="359" y="423" text-anchor="middle" class="ts">RAPTOR 树检索</text>
  <text x="359" y="438" text-anchor="middle" class="ts">分歧聚焦 · 报告进记忆</text>

  <rect x="474" y="368" width="196" height="86" class="box-dim"/>
  <text x="572" y="390" text-anchor="middle" class="t">🔍 Agentic 工具集</text>
  <text x="572" y="408" text-anchor="middle" class="ts">多 Agent 并行研究</text>
  <text x="572" y="423" text-anchor="middle" class="ts">OCR · 沙箱 · 文档</text>
  <text x="572" y="438" text-anchor="middle" class="ts">LlamaIndex 知识库</text>

  <!-- 大脑→子系统连线 -->
  <line x1="147" y1="352" x2="147" y2="368" class="arrow"/>
  <line x1="359" y1="352" x2="359" y2="368" class="arrow"/>
  <line x1="572" y1="352" x2="572" y2="368" class="arrow"/>

  <!-- 第 3→4 层箭头 -->
  <line x1="380" y1="470" x2="380" y2="502" class="arrow"/>

  <!-- 第 4 层：外部服务 -->
  <rect x="30" y="512" width="660" height="70" class="layer"/>
  <text x="50" y="536" class="lbl">外部服务</text>
  <rect x="50" y="524" width="150" height="46" class="ext"/>
  <text x="125" y="544" text-anchor="middle" class="t">DeepSeek</text>
  <text x="125" y="560" text-anchor="middle" class="ts">LLM 主模型</text>
  <rect x="215" y="524" width="150" height="46" class="ext"/>
  <text x="290" y="544" text-anchor="middle" class="t">Ollama</text>
  <text x="290" y="560" text-anchor="middle" class="ts">bge-m3 embedding</text>
  <rect x="380" y="524" width="150" height="46" class="ext"/>
  <text x="455" y="544" text-anchor="middle" class="t">GLM-4.6V</text>
  <text x="455" y="560" text-anchor="middle" class="ts">视觉理解（识图）</text>
  <rect x="545" y="524" width="125" height="46" class="ext"/>
  <text x="607" y="544" text-anchor="middle" class="t">Tavily+博查</text>
  <text x="607" y="560" text-anchor="middle" class="ts">双源搜索</text>
</svg>
