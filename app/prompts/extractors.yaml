# 提炼器 prompt 外置（2026-08-19，与 static_prompt.yaml 同模式——prompt 是数据不是代码）
# 修改此文件 = 修改会话收尾钩子的提炼器提示词。改完重启服务生效，无需改代码。
# 每个键对应 tutor.py 的一个提炼器；{...} 是运行时填充的动态槽位。

# 画像维护器（2026-08-21 四操作增量 diff——复刻 Mem0 DEFAULT_UPDATE_MEMORY_PROMPT 结构：
# 逐条决策 ADD/UPDATE/DELETE/NONE，NONE 条目原样返回防漂移；对齐 Letta 只更新变化块）
profile: |-
  你是画像维护器。输入分两部分：【当前画像】= 现有用户画像（事实行，每行带 [id]）；【新增记忆】= 上次提炼后新产生的记忆条目。
  对每条画像事实与新增记忆做四操作决策：
  ADD=新增记忆含跨会话稳定新事实（三性：跨会话成立/影响我的行为/重新检索成本高），追加为新行；
  UPDATE=现有事实有新进展或更准表达（保留原 id，text 取信息量大者）；
  DELETE=现有事实被推翻/已失效/与新增记忆矛盾；
  NONE=无变化（大多数情况——新增记忆多为学习记录/笔记/单次事件，与画像无关，一律 NONE）。
  画像只收跨会话稳定事实：背景/偏好/关键进度快照/关键状态。困惑、情绪、单次事件、测试信息永不进画像。
  输出 JSON（每条画像行都必须有对应条目，NONE 也要列出）：
  {"memory": [{"id":"p1","text":"<原样或更新后>","event":"NONE|UPDATE|DELETE","old_memory":"<仅UPDATE填>"}, {"id":"new","text":"<新事实>","event":"ADD"}]}
  规则：
  - NONE 条目 text 必须原样返回、禁止改写（防漂移）；
  - UPDATE 保留原 id、text 用信息量更大的表达；
  - DELETE 仅当矛盾/失效（被新增记忆明确推翻才删）；
  - ADD 的 id 写 "new"（正式 id 由代码分配）；
  - 只输出 JSON，不要解释。

# 困惑提炼器（五判据驱动；来源约束=refs 白名单）
confusion: |-
  你是困惑识别器。从一段对话里判断用户是否有『认知层面的开放困惑』。
  五条判据（全部满足才算困惑）：
  ①一次对话闭环不了（跨多轮、无简单答案）；
  ②是'不知道怎么办'（问句/纠结句），不是事实陈述也不是情绪感受；
  ③不解决会影响用户下一步行动；
  ④用户主动说出的（不是你的推断）；
  ⑤是开放问题不是断言。
  有困惑→只输出一句话（用户视角的开放问题，如『是否该换个学习方向』）；
  没有→输出『无』。不要解释，不要输出其他。
  来源约束（2026-08-19 refs 白名单）：困惑表述只能基于对话中实际出现的内容——
  用户没说过的话/对话里没有的信息，禁止编造进困惑。

# 闪光提炼器（2026-08-20：拾光=拾到我们没发现的闪光——用户没发现的自己，不是夸奖）
glint: |-
  你是闪光发现者。从一段对话里寻找用户身上『他自己没发现的闪光』。
  三判据（有其一即可）：
  ①模式发现：对话暴露了用户没意识到的行为/思考规律（如反复卡在同一类问题上，但每次卡的方式在进化）；
  ②潜力看见：对话里有用户没当回事的能力证据（如自发用对了框架/问出了关键问题，却觉得自己不行）；
  ③洞见揭示：用户自己的话里藏着一个他还没说破的认识（他自己讲出了答案但没意识到）。
  判别边界：
  - 闪光≠夸奖（'你问得真好'是夸奖不是闪光——必须是有发现的信息）；
  - 闪光≠困惑（困惑是向上求助的卡点，闪光是你向下看见的亮点）；
  - 只基于对话实际出现的内容，禁止编造。
  有闪光→只输出两行：第一行『类型：模式发现/潜力看见/洞见揭示』，第二行闪光描述（用户视角，如『你三次卡在 L1/L2 上，但这次你已经会区分'惩罚项'和'强度'了——卡壳不是退步，是理解的层次在换』）；
  没有→输出『无』。不要解释，不要输出其他。

# 关系轨提炼器（depth/last_topic/tone 三维）
relation: |-
  你是关系观察员。从一段对话里提炼『拾光与用户之间』的关系状态（慢变信息），
  三个维度：
  depth=聊到什么深度（浅聊/深聊/互相纠正过/深入探讨…）；
  last_topic=核心话题（一句话，如『学习方向困惑』）；
  tone=相处基调（平等/被接住/被挑战/互相纠正…）。
  只输出 JSON：{"depth":"…","last_topic":"…","tone":"…"}；
  若对话没有实质关系信息（纯寒暄/纯指令执行），输出『无』。不要解释，不要输出其他。
  来源约束（2026-08-19 refs 白名单）：三个维度只能基于对话中实际发生的内容——
  对话里没有的相处细节禁止编造。

# 续接点提炼器（未完成线程）
continuation: |-
  你是续接点识别器。从一段对话里判断是否有『未完成的学习/讨论线程』——
  即下次接着聊时应该从哪继续（如『下一步该学什么』『上次的自测题还没答』）。
  判据：有明确未完成的线程（约定下次做/卡住未解决/计划中的下一步）→ 输出一句话续接点；
  没有（对话已闭环/纯闲聊/临时疑问已解决）→ 输出『无』。不要解释，不要输出其他。
  来源约束（2026-08-19 refs 白名单）：续接点只能来自对话中实际提到的未完成事项——
  对话没提到的线程禁止编造（防幻觉续接点误导下次学习）。

# 教学经验提炼器（反思+技能两字段；来源约束）
teaching: |-
  你是教学复盘教练。从一段对话里提炼『教学经验』（拾光讲解 vs 用户学习的互动复盘）：
  reflection=这次暴露的坑（如：直接抛公式用户没听懂；讲太快；例子没接住），
  skill_desc=这次有效的讲法适用于什么情境（何时用，一句话，如『讲正则化时』），
  skill_method=具体怎么讲（怎么讲，如『先用教练/学员故事建立直觉，最后才给公式』）。
  判据（防噪音，闲聊/纯指令执行/已闭环对话不写）：
  ①有真实的教与学互动；②暴露了可改进的坑或有可复用的讲法；
  ③内容具体可操作（不要泛泛而谈『讲清楚一点』这种）。
  来源约束（2026-08-19 refs 白名单）：反思与技能只能基于对话中实际发生的内容——
  没出现的讲法/没暴露的坑，禁止编造。
  只输出 JSON：{"reflection":"…","skill_desc":"…","skill_method":"…"}（某字段无价值就给空串）；
  若整段对话没有教学经验（纯闲聊/纯工具操作/问题已闭环），输出『无』。不要解释，不要输出其他。

# 主题提炼器（意图驱动 + 源头归并；{existing}=运行时填充的已有主题列表）
topics: |-
  你是主题识别器。从一段对话里判断『本次涉及哪些学习主题』。
  已收录主题（含别名）供参考，能对上就输出已有名字（源头归并，不要另造同义词）：
  {existing}
  对每个主题输出 JSON 条目，intent 四分类：
  learning=在学/继续/回顾想续（更新活跃）；new=明确开始学新主题（可能新建）；
  farewell=告别/放弃（不激活）；mention=只是提到不是想学（不动，防误伤）。
  confidence=high/low（判断把握）。
  status=可选状态变更（2026-08-21 状态细粒度归模型——仅对话明确暴露时输出，无强信号留空）：
  done=学完/收尾/想通（用户明说"我会了/搞懂了/学完了"）；stuck=卡住/没懂/学不动（用户明说"还是不懂/卡在这"）；
  shelved=告别/放弃（用户明说"不学了"）；只输出对话明确表达的，不推断不脑补。
  只输出 JSON：{"topics":[{"name":"…","intent":"…","confidence":"…","status":"…"}]}（status 无强信号写空串）；
  若无实质学习主题（纯闲聊/纯工具操作/无主题），输出『无』。不要解释，不要输出其他。
  来源约束（2026-08-19 refs 白名单）：主题只能来自对话中实际讨论的内容——
  对话没提到的主题禁止输出（防幻觉主题污染主题库）。

# ACE Reflector（2026-08-30，设计 docs/2026-08-30-ACE-PLAYBOOK-DESIGN.md §3）：
# 教学策略 delta 提炼。{signals} = 代码侧采集的接地信号摘要（harness .replace 注入，非模型生成）。
playbook: |-
  你是教学策略复盘员（ACE Reflector）。输入两部分：【对话】+【本轮接地信号】（系统采集的真实事件：
  被检索命中的技能/工具失败序列/verify 验证结果/用户显式反馈）。
  只从有接地证据支撑的本轮事实里，提炼教学策略库的增量 delta（JSON 数组），操作两种：
  - add=本轮真实发生且被信号佐证的有效讲法或失败模式，content 用「背景：什么情境用\n步骤：- …」格式；
  - revise=修订被检索技能中的某条（id 填信号里列出的 sid），content 为修订后的完整条目内容。
  禁止输出 bump——helpful/harmful 计数由系统按接地信号自动推进，不归你评估（评估了也会被丢弃）。
  判据（防噪音）：①必须有接地信号支撑（信号摘要为空/写"无"→ 输出『无』）；
  ②内容具体可操作，泛泛而谈不写；③add 与库内已有策略明显重复的不要重复输出。
  来源约束（refs 白名单）：只能基于对话实际发生的内容与信号里列出的事实，禁止编造。
  只输出 JSON 数组：[{"op":"add","section":"讲法","content":"…"},{"op":"revise","id":"a3f9c2","content":"…"}]；
  无可提炼 → 输出『无』。不要解释，不要输出其他。
  【本轮接地信号】
  {signals}

# 跨域类比提炼器（2026-08-31，路线图 v3.0 §4「差异化心脏」——
# 「你学 React 的组件思维，和你练人际沟通的边界感，是同一个结构」）。
# 输入=user 消息里的【近期记忆】+【主题列表】（harness 拼装，无占位槽位——避开 .format 吞花括号教训）。
analogy: |-
  你是跨域类比发现者。输入两部分：【近期记忆】= 用户近 30 天的记忆条目；【主题列表】= 用户在学的主题。
  你的任务：找一条『结构同构』的跨域连接——两个不同领域/主题下的学习或经历，底层是同一个结构
  （如『React 的组件思维』和『人际沟通的边界感』都是"划分边界、定义接口"）。
  判据（宁缺毋滥，每周至多一条）：
  ①两个域必须都来自给定材料（不同主题/领域），禁止编造材料里没有的经历；
  ②必须是结构同构（抽象机制相同）——表面相似（都有"学习"二字/同一人物）不算；
  ③evidence_a / evidence_b 必须【逐字摘录】记忆条目里的内容片段（原文子串），禁止改写/概括。
  只输出 JSON：{"analogy":"…","domain_a":"…","domain_b":"…","evidence_a":"…","evidence_b":"…"}；
  找不到真正的结构同构 → 输出『无』。不要解释，不要输出其他。

# 会话压缩器（2026-08-29 Phase2 C-1）：长会话早期历史 → 锚定增量摘要。
# 前沿依据：Claude Code auto-compact（保留 8-10 轮原文、摘要作续会消息）+
# LangMem running summary（增量合并不重建）+ JetBrains 2508.21433（摘要抹平停手信号→多跑 15% 轮次）。
# {prev} = 已有纪要（无则空）；{span} = 本次要压缩的对话片段。
compact: |-
  你是会话纪要合并器。输入两部分：【已有纪要】= 之前压缩产出的结构化纪要（可能为空）；【新对话片段】= 本次需要压缩的早期对话。
  把新片段的信息【增量合并】进已有纪要（不是重写——已有内容保留，只补充新片段带来的变化与新增信息）。
  严格四字段结构：
  1. goal（用户意图）：原始目标与目标变化——用户到底想做什么，说人话
  2. decisions（关键决策）：已拍板的决定与理由（如"选了 X 方案因为 Y"）
  3. open（未完成事项）：待办、没做完的、下次要继续的
  4. entities（重要实体）：人/文件/概念/数据/URL 等后续可能引用的具体对象
  【铁律：失败与停滞信号必须保留】——对话里"卡住了/没懂/试了不行/做错了/推翻了"等痕迹
  必须如实写进 open 或 decisions，禁止润色成"顺利进行"（抹平停手信号会让后续对话多跑无效轮次）。
  规则：
  - 已有纪要字段原样保留，只合并增量（语义相同不重复）；
  - 每条 ≤ 30 字；总长 ≤ 450 字；中文；
  - 只输出 JSON：{"goal":"…","decisions":["…"],"open":["…"],"entities":["…"]}
  - 不要解释，不要输出其他。
